# Gitleaks configuration — extends the default rule set.
# Docs: https://github.com/gitleaks/gitleaks#configuration
#
# CI bundles gitleaks 8.24.x, which uses [allowlist] (not [[allowlists]] from 8.25+).

title = "nest_secure"

[extend]
useDefault = true

[allowlist]
description = "CI workflow placeholders — never used outside GitHub Actions"
paths = [
  '''\.github/workflows/ci\.yml$''',
]
# Match secret values (regexTarget defaults to the extracted secret)
regexes = [
  '''(?i)^ci-(only-)?(test|refresh)-secret''',
]
