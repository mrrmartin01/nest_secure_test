services:
  dev-db:
    image: postgres:13
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${DEV_DB_USER:-devuser}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-123}
      POSTGRES_DB: dev_db
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-devuser}"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - app-network

  test-db:
    image: postgres:13
    profiles: ["test"]
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-testuser}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-123}
      POSTGRES_DB: test_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-testuser}"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - app-network

volumes:
  dev-db-data:

networks:
  app-network:
    driver: bridge